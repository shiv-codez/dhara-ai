# Render blueprint for the optional API (free instance sleeps after 15 min idle; first call takes ~30-60 s)
services:
  - type: web
    name: dhara-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn dhara.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
