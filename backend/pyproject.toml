[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dhara"
version = "0.1.0"
description = "Dhara.ai – drone imagery to candidate cadastral parcel maps"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "shapely>=2.1",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "rasterio>=1.4",
    "scipy>=1.11",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.9",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
train = ["scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["dhara*"]
